# Generated by android-play-automation (template v4).
# Hand-edits are detected: regeneration shows a diff and asks first.
name: Release YapNPlay

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-YapNPlay-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    # Pinned to a fixed runner version (never the floating latest label):
    # label migrations (e.g. 24 -> 26) leave jobs queued until GitHub gives
    # up ("not acquired by Runner ... after multiple attempts"). 24.04 is
    # stable and builds Android fine.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/release.jks

      - name: Build & Sign AAB
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate release artifacts
        id: artifacts
        # Outputs are named after the Gradle module (androidApp-release.aab in
        # KMP projects, app-release.aab otherwise) - discovered here so no
        # filename is ever hardcoded in this workflow.
        run: |
          AAB="$(find androidApp/build/outputs/bundle -name '*.aab' -type f -print -quit 2>/dev/null || true)"
          if [ -z "$AAB" ]; then
            echo "::error::No AAB under androidApp/build/outputs/bundle - did 'bundleRelease' produce one?"
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB"
          MAP="$(find androidApp/build/outputs/mapping -name mapping.txt -type f -print -quit 2>/dev/null || true)"
          if [ -z "$MAP" ]; then
            echo "::error::No mapping.txt under androidApp/build/outputs/mapping (minify is on - expected one)"
            exit 1
          fi
          echo "mapping=$MAP" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play (alpha)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.kglabs28.yapnplay
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          mappingFile: ${{ steps.artifacts.outputs.mapping }}
          tracks: alpha
          status: completed
