# Generated by android-play-automation (template v2).
# Hand-edits are detected: regeneration shows a diff and asks first.
name: Release YapNPlay

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-YapNPlay-{{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    # Pinned to a fixed runner version (never the floating latest label):
    # label migrations (e.g. 24 -> 26) leave jobs queued until GitHub gives
    # up ("not acquired by Runner ... after multiple attempts"). 24.04 is
    # stable and builds Android fine.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/release.jks

      - name: Build & Sign AAB
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.kglabs28.yapnplay
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          tracks: internal
          status: completed
