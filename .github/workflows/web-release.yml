# The web app only (iPhone users and any browser): builds :webApp and
# publishes it to GitHub Pages at https://keshavgupta-mnnit.github.io/YapNPlay/ .
#
# Runs on its own:  a web-only tag (web-v1.0.3) or by hand from the Actions tab.
# Also called by:   release.yml on every v* tag, so mobile and web ship together.
#
# One-time setup (repo Settings):
#   - Pages > Build and deployment > Source: "GitHub Actions".
#   - Environments > github-pages > Deployment branches and tags: add tag rules v* and web-v*.
#   - Secrets and variables > Actions > Variables: GOOGLE_WEB_CLIENT_ID = the web
#     OAuth client id (public; the backend's GOOGLE_WEB_CLIENT_ID is the same value).
name: Release YapNPlay Web

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release-YapNPlay-web
  cancel-in-progress: true

jobs:
  build:
    # Same fixed runner as release.yml (never the floating latest label).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-web-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-web-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the web app
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Fill in the Google client id
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Set the repository variable GOOGLE_WEB_CLIENT_ID (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          sed -i "s|__GOOGLE_WEB_CLIENT_ID__|$GOOGLE_WEB_CLIENT_ID|" webApp/build/dist/wasmJs/productionExecutable/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
