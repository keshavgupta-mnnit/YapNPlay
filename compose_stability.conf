// Types Compose may treat as stable (never changed in place once built), so a screen
// part whose inputs are equal to last time is skipped instead of redrawn.
// Every list, map and set handed to the UI is built fresh and never mutated afterwards.
kotlin.collections.*
// Points in time: immutable values.
kotlinx.datetime.Instant
kotlinx.datetime.LocalDate
kotlinx.datetime.LocalDateTime
kotlin.time.Duration
