<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- Added to the Home Screen it opens full screen, like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YapNPlay">
    <meta name="theme-color" content="#050917">
    <!-- The web OAuth client id for Google sign-in (public). The release workflow fills it in. -->
    <meta name="yapnplay-google-client-id" content="__GOOGLE_WEB_CLIENT_ID__">
    <title>YapNPlay</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050917;
            /* No pull-to-refresh, bounce or double-tap zoom over the game. */
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
    <!-- Voice: LiveKit's browser SDK (the global LivekitClient), pinned to one version. -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
    <script type="application/javascript" src="yapnplay.js"></script>
</head>
<body></body>
</html>
